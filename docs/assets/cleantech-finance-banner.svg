<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">CleanTech Finance — Evidence before judgment</title>
  <desc id="description">A dark navy and orange banner showing the claim to evidence to rule to human review workflow.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.62" stop-color="#0e2137"/>
      <stop offset="1" stop-color="#132b3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a18"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <path d="M0 328 C220 270 355 402 570 328 S930 260 1200 330 V420 H0Z" fill="#0a1929" opacity=".92"/>
  <circle cx="1064" cy="76" r="184" fill="#ff8a1f" opacity=".055"/>
  <circle cx="1048" cy="72" r="116" fill="#ff8a1f" opacity=".07"/>
  <rect x="64" y="52" width="8" height="76" rx="4" fill="url(#accent)"/>

  <text x="98" y="90" fill="#ff9a3d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">LOCAL-FIRST · EVIDENCE-FIRST</text>
  <text x="98" y="150" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="800">CleanTech Finance</text>
  <text x="98" y="196" fill="#b8c8d8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">让每一个判断，都能回到原始证据。</text>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="98" y="252" width="200" height="84" rx="16" fill="#132b43" stroke="#28506d"/>
    <text x="198" y="286" fill="#91a9bc" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="2">01 · CLAIM</text>
    <text x="198" y="314" fill="#ffffff" text-anchor="middle" font-size="19" font-weight="700">原子主张</text>

    <path d="M310 294 H350" stroke="#ff9838" stroke-width="4" stroke-linecap="round"/>
    <path d="M342 286 L352 294 L342 302" fill="none" stroke="#ff9838" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="364" y="252" width="200" height="84" rx="16" fill="#132b43" stroke="#28506d"/>
    <text x="464" y="286" fill="#91a9bc" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="2">02 · EVIDENCE</text>
    <text x="464" y="314" fill="#ffffff" text-anchor="middle" font-size="19" font-weight="700">证据与出处</text>

    <path d="M576 294 H616" stroke="#ff9838" stroke-width="4" stroke-linecap="round"/>
    <path d="M608 286 L618 294 L608 302" fill="none" stroke="#ff9838" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="630" y="252" width="200" height="84" rx="16" fill="#132b43" stroke="#28506d"/>
    <text x="730" y="286" fill="#91a9bc" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="2">03 · RULE</text>
    <text x="730" y="314" fill="#ffffff" text-anchor="middle" font-size="19" font-weight="700">确定性规则</text>

    <path d="M842 294 H882" stroke="#ff9838" stroke-width="4" stroke-linecap="round"/>
    <path d="M874 286 L884 294 L874 302" fill="none" stroke="#ff9838" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="896" y="252" width="216" height="84" rx="16" fill="url(#accent)"/>
    <text x="1004" y="286" fill="#6b2b00" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="2">04 · REVIEW</text>
    <text x="1004" y="314" fill="#111827" text-anchor="middle" font-size="19" font-weight="800">人工复核</text>
  </g>

  <text x="1098" y="394" fill="#6f879a" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">v0.4 · Apache-2.0</text>
</svg>
