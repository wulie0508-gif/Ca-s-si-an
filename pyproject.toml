[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cleantech-finance"
version = "0.4.0"
description = "Evidence-first financial and bankability research for clean energy companies"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Cassian" },
  { name = "CleanTech Finance contributors" },
]
keywords = [
  "clean-energy",
  "climate-tech",
  "commercialization",
  "due-diligence",
  "evidence",
  "adoption-readiness",
  "bankability",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5,<7"]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "jsonschema>=4.23,<5"]

[project.scripts]
cleantech-finance = "cleantech_finance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
